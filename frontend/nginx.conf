server {
    listen 80;
    root /usr/share/nginx/html;

    # Single-page app: any path that isn't a real file (e.g. /orders/ORD-..., /cart after a
    # reload) gets index.html, and React Router shows the right page.
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Build output has content hashes in its file names, so it can be cached for good.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
