server:
  port: 8084

jwt:
  secret: ${JWT_SECRET:change-this-shared-secret-change-this-shared-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  application:
    name: cart-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    #    url: jdbc:mysql://localhost:3306/cartdb
    url: jdbc:mysql://cart-db:3306/cartdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  logging:
    level:
      spring.cloud.gateway: DEBUG
      org.springframework.security: DEBUG
      org.springframework.web: DEBUG
      root: INFO
      feign: DEBUG
      com.example.cart_service.client: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
