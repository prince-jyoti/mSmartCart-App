server:
  port: 8084
user:
  service:
#    url: http://localhost:8082
    url: http://user-serivce:8082
product:
  service:
#    url: http://localhost:8081
    url: http://product-serivce:8081
spring:
  datasource:
#    url: jdbc:mysql://localhost:3306/cartdb
    url: jdbc:mysql://cart-db:3306/cartdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  security:
    oauth2:
      resourceserver:
        jwt:
#          issuer-uri: http://localhost:8080/realms/myrealm
          issuer-uri: http://keycloak:8080/realms/myrealm
    logging:
      level:
        spring.cloud.gateway: DEBUG
        org.springframework.security: DEBUG
        org.springframework.web: DEBUG
        root: INFO
        feign: DEBUG
        com.example.cart_service.client: DEBUG

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect