server:
  port: 8081

jwt:
  secret: ${JWT_SECRET:change-this-shared-secret-change-this-shared-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  application:
    name: product-service
  datasource:
#    url: jdbc:mysql://localhost:3306/productdb
    url: jdbc:mysql://product-db:3306/productdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  logging:
    level:
      root: INFO
      com.example.product_service: INFO


  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect