server:
  port: 8081

# Housekeeping: processed event ids older than the retention are deleted every interval.
processed-events:
  cleanup:
    retention: ${PROCESSED_EVENTS_RETENTION:P30D}
    interval: PT1H

jwt:
  secret: ${JWT_SECRET:change-this-shared-secret-change-this-shared-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    registry-fetch-interval-seconds: 5      # default 30: how stale this service's view of the registry can be
  instance:
    lease-renewal-interval-in-seconds: 5    # heartbeat; default 30
    lease-expiration-duration-in-seconds: 15  # a crashed instance is dropped after this; default 90

spring:
  application:
    name: product-service
  datasource:
#    url: jdbc:postgresql://localhost:5432/productdb
    url: jdbc:postgresql://product-db:5432/productdb
    username: smartcart
    password: smartcart
    driver-class-name: org.postgresql.Driver

  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:smartcart}
    password: ${RABBITMQ_PASSWORD:smartcart}
    listener:
      simple:
        default-requeue-rejected: false   # after the retries, failed messages go to the DLQ
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
  flyway:
    # Databases created before Flyway already hold the V1 schema: record them as V1 instead of
    # running it. Fresh databases run V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema (db/migration); Hibernate only checks it matches
    show-sql: false
