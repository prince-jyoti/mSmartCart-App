server:
  port: 8083

spring:
  cloud:
    gateway:
      routes:
        - id: product-service
#          uri: http://localhost:8081
          uri: http://product-service:8081
          predicates:
            - Path=/products/**
        - id: user-service
#          uri: http://localhost:8082
          uri: http://user-service:8082
          predicates:
            - Path=/user/**
        - id: cart-service
#          uri: http://localhost:8084
          uri: http://cart-service:8084
          predicates:
            - Path=/carts/**
        - id: order-service
#          uri: http://localhost:8085
          uri: http://order-service:8085
          predicates:
            - Path=/orders/**
        - id: payment-service
#          uri: http://localhost:8086
          uri: http://payment-service:8086
          predicates:
            - Path=/payments/**
      globalcors:
        add-to-simple-url-handler-mapping: true
        corsConfigurations:
          '[/**]':
            allowedOrigins:
              - "http://localhost:5173"
#              - "http://frontend:80"
            allowedMethods:
              - "*"
            allowedHeaders:
              - "*"
            allowCredentials: true
  security:
    oauth2:
      resourceserver:
        jwt:
#          issuer-uri: http://localhost:8080/realms/myrealm
          issuer-uri: http://keycloak:8080/realms/myrealm
    logging:
      level:
        spring.cloud.gateway: DEBUG
        org.springframework.security: DEBUG
