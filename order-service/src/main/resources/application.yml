server:
  port: 8085

# Unpaid orders (PENDING or PAYMENT_FAILED) expire after this long and their reserved stock is
# released. ISO-8601 durations; override with ORDER_EXPIRY_AFTER / ORDER_EXPIRY_SCAN_INTERVAL.
order:
  expiry:
    after: ${ORDER_EXPIRY_AFTER:PT30M}
    scan-interval: ${ORDER_EXPIRY_SCAN_INTERVAL:PT1M}

# Housekeeping: published outbox events older than the retention are deleted every interval.
outbox:
  cleanup:
    retention: ${OUTBOX_RETENTION:P7D}
    interval: PT1H

jwt:
  secret: ${JWT_SECRET:change-this-shared-secret-change-this-shared-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/
    registry-fetch-interval-seconds: 5      # default 30: how stale this service's view of the registry can be
  instance:
    lease-renewal-interval-in-seconds: 5    # heartbeat; default 30
    lease-expiration-duration-in-seconds: 15  # a crashed instance is dropped after this; default 90

spring:
  application:
    name: order-service
  cloud:
    loadbalancer:
      cache:
        ttl: 5s   # default 35 s: how long instance lists are cached before asking Eureka again
    openfeign:
      circuitbreaker:
        enabled: true
      client:
        config:
          default:   # fail fast instead of holding a request thread for 60 s
            connect-timeout: 2000
            read-timeout: 5000
    # Run Feign calls on the calling thread. Resilience4j otherwise moves them to its own
    # thread pool, which has no SecurityContext, so FeignClientConfig sends no JWT.
    circuitbreaker:
      resilience4j:
        disable-thread-pool: true
  datasource:
    #    url: jdbc:postgresql://localhost:5432/orderdb
    url: jdbc:postgresql://order-db:5432/orderdb
    username: smartcart
    password: smartcart
    driver-class-name: org.postgresql.Driver

  flyway:
    # Databases created before Flyway already hold the V1 schema: record them as V1 instead of
    # running it. Fresh databases run V1 normally.
    baseline-on-migrate: true
    baseline-version: 1
  jpa:
    hibernate:
      ddl-auto: validate   # Flyway owns the schema (db/migration); Hibernate only checks it matches
    show-sql: false
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:smartcart}
    password: ${RABBITMQ_PASSWORD:smartcart}
    publisher-confirm-type: correlated   # OutboxPublisher waits for broker confirms
    listener:
      simple:
        default-requeue-rejected: false   # failed messages go to the DLQ, never back to the head of the queue
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
