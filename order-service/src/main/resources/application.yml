server:
  port: 8085

jwt:
  secret: ${JWT_SECRET:change-this-shared-secret-change-this-shared-secret}

eureka:
  client:
    service-url:
      defaultZone: http://eureka-server:8761/eureka/

spring:
  application:
    name: order-service
  cloud:
    openfeign:
      circuitbreaker:
        enabled: true
  datasource:
    #    url: jdbc:mysql://localhost:3306/orderdb
    url: jdbc:mysql://order-db:3306/orderdb
    username: root
    password: root
    driver-class-name: com.mysql.cj.jdbc.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    database-platform: org.hibernate.dialect.MySQL8Dialect
  rabbitmq:
    host: ${RABBITMQ_HOST:rabbitmq}
    port: 5672
    username: ${RABBITMQ_USER:smartcart}
    password: ${RABBITMQ_PASSWORD:smartcart}
    listener:
      simple:
        default-requeue-rejected: false   # failed messages go to the DLQ, never back to the head of the queue
        retry:
          enabled: true
          max-attempts: 5
          initial-interval: 1s
          multiplier: 2
