services:
  # ===================== SERVICE DISCOVERY =====================
  eureka-server:
    build:
      context: ./eureka-server
      dockerfile: Dockerfile
    ports:
      - "8761:8761"
    networks:
      - microservices-net

  # ===================== API GATEWAY =====================
  gateway-service:
    build:
      context: ./gateway-service
      dockerfile: Dockerfile
    environment:
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
    depends_on:
      - eureka-server
      - product-service
      - user-service
      - cart-service
      - order-service
      - payment-service
    ports:
      - "8083:8083"
    networks:
      - microservices-net

  # ===================== PRODUCT SERVICE =====================
  product-service:
    build:
      context: ./product-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-smartcart}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcart}
      SPRING_DATASOURCE_URL: jdbc:postgresql://product-db:5432/productdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartcart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartcart}
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
    depends_on:
      product-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8081:8081"
    networks:
      - microservices-net

  product-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-smartcart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart}
      POSTGRES_DB: productdb
    ports:
      - "5433:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - productdb-pgdata:/var/lib/postgresql/data
  # ===================== USER SERVICE =====================
  user-service:
    build:
      context: ./user-service
      dockerfile: Dockerfile
    environment:
      SPRING_DATASOURCE_URL: jdbc:postgresql://user-db:5432/userdb
      ADMIN_EMAIL: ${ADMIN_EMAIL:-}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-}
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartcart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartcart}
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
    depends_on:
      user-db:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8082:8082"
    networks:
      - microservices-net

  user-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-smartcart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart}
      POSTGRES_DB: userdb
    ports:
      - "5434:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - userdb-pgdata:/var/lib/postgresql/data

  # ===================== CART SERVICE =====================
  cart-service:
    build:
      context: ./cart-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-smartcart}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcart}
      SPRING_DATASOURCE_URL: jdbc:postgresql://cart-db:5432/cartdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartcart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartcart}
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
    depends_on:
      cart-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8084:8084"
    networks:
      - microservices-net

  cart-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-smartcart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart}
      POSTGRES_DB: cartdb
    ports:
      - "5435:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - cartdb-pgdata:/var/lib/postgresql/data

  # ===================== ORDER SERVICE =====================
  order-service:
    build:
      context: ./order-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-smartcart}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcart}
      SPRING_DATASOURCE_URL: jdbc:postgresql://order-db:5432/orderdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartcart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartcart}
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
    depends_on:
      order-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8085:8085"
    networks:
      - microservices-net

  order-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-smartcart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart}
      POSTGRES_DB: orderdb
    ports:
      - "5436:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - orderdb-pgdata:/var/lib/postgresql/data

  # ===================== PAYMENT SERVICE =====================
  payment-service:
    build:
      context: ./payment-service
      dockerfile: Dockerfile
    environment:
      RABBITMQ_HOST: rabbitmq
      RABBITMQ_USER: ${RABBITMQ_USER:-smartcart}
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD:-smartcart}
      SPRING_DATASOURCE_URL: jdbc:postgresql://payment-db:5432/paymentdb
      SPRING_DATASOURCE_USERNAME: ${DB_USER:-smartcart}
      SPRING_DATASOURCE_PASSWORD: ${DB_PASSWORD:-smartcart}
      JWT_SECRET: ${JWT_SECRET:-change-this-shared-secret-change-this-shared-secret}
      RAZORPAY_KEY: ${RAZORPAY_KEY}
      RAZORPAY_SECRET: ${RAZORPAY_SECRET}
    depends_on:
      payment-db:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy
      eureka-server:
        condition: service_started
    ports:
      - "8086:8086"
    networks:
      - microservices-net

  payment-db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${DB_USER:-smartcart}
      POSTGRES_PASSWORD: ${DB_PASSWORD:-smartcart}
      POSTGRES_DB: paymentdb
    ports:
      - "5437:5432"
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 5
    volumes:
      - paymentdb-pgdata:/var/lib/postgresql/data


  # ===================== MESSAGE BROKER =====================
  rabbitmq:
    image: rabbitmq:3.13-management
    environment:
      RABBITMQ_DEFAULT_USER: ${RABBITMQ_USER:-smartcart}
      RABBITMQ_DEFAULT_PASS: ${RABBITMQ_PASSWORD:-smartcart}
    ports:
      - "15672:15672"   # management UI only; AMQP (5672) stays inside the compose network
    networks:
      - microservices-net
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 10s
      timeout: 5s
      retries: 10
    volumes:
      - rabbitmq-data:/var/lib/rabbitmq

  # ===================== FRONTEND =====================
  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    ports:
      - "5173:80"
    depends_on:
      - gateway-service
    networks:
      - microservices-net

# ===================== NETWORK =====================
networks:
  microservices-net:
    driver: bridge


# ===================== VOLUMES =====================
volumes:
  userdb-pgdata:
  productdb-pgdata:
  cartdb-pgdata:
  orderdb-pgdata:
  paymentdb-pgdata:
  rabbitmq-data: